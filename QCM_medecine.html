<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM médecine</title>
<style>
:root{color-scheme:light;--ink:#17283c;--quiet:#48596a;--line:#d5e0e8;--blue:#165e76;--paper:#fff;--bg:#f1f6f8;--good:#145640;--bad:#942e35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 system-ui,sans-serif}
header{background:#102b3b;color:white}
.header,main{max-width:54rem;margin:auto;padding:1.15rem clamp(1rem,4vw,2rem)}
.header{display:flex;gap:.7rem 1.4rem;justify-content:space-between;align-items:center;flex-wrap:wrap}
.brand{font-weight:750;letter-spacing:.015em;font-size:1.2rem}
header button{background:transparent;color:white;border-color:#7194a5}
main{padding-top:1.8rem;padding-bottom:2.5rem}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.12;letter-spacing:-.035em;margin-bottom:.5rem}
h2{font-size:1.38rem;line-height:1.35}
h3{font-size:1.08rem;line-height:1.42}
.muted,.ref{color:var(--quiet)}
.progress-row{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-bottom:.35rem;color:var(--quiet);font-size:.93rem}
progress{width:100%;height:.5rem;display:block;accent-color:var(--blue);margin-bottom:1.1rem}
.card,details{background:var(--paper);border:1px solid var(--line);border-radius:1rem;padding:clamp(1rem,4vw,1.65rem)}
.card{box-shadow:0 5px 18px #142f4010}
.option,.review{border:1px solid var(--line);border-radius:.65rem;padding:.72rem .85rem;margin:.55rem 0;overflow-wrap:anywhere}
.option{display:flex;gap:.65rem;align-items:flex-start;cursor:pointer}
.option:has(input:checked){background:#e6f4f9;border-color:var(--blue)}
.option:hover{border-color:var(--blue)}
input[type=checkbox]{width:1.15rem;height:1.15rem;flex:none;margin:.23rem 0 0;accent-color:var(--blue)}
.letter{font-weight:750;min-width:1.25rem}
.actions,.tabs{display:flex;gap:.55rem;flex-wrap:wrap}
.actions{margin-top:1.2rem;justify-content:space-between}
.tabs{margin-bottom:.9rem}
button{font:inherit;font-weight:650;cursor:pointer;padding:.47rem .85rem;border:1px solid var(--line);background:white;color:var(--ink);border-radius:.58rem;min-height:2.6rem}
button:disabled{opacity:.5;cursor:default}
.primary,.tabs button[aria-current=true]{color:white;background:var(--blue);border-color:var(--blue)}
.tabs button[data-answered=true]:not([aria-current=true]){background:#dceef3;border-color:#8cb9c6}
:focus-visible{outline:3px solid #247897;outline-offset:3px}
details{margin-top:1.15rem}
summary{cursor:pointer;font-weight:700}
details p{margin-top:.9rem}
textarea{width:100%;min-height:8rem;font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:.55rem;padding:.7rem}
label[for=bank-text]{display:block;margin-top:1rem;font-weight:650}
.status{color:var(--bad);margin:0}
.status:not(:empty){margin:.65rem 0}
.review.correct{border-left:4px solid var(--good)}
.review.error{border-left:4px solid var(--bad)}
.review p{margin:.3rem 0 0}
.ref{font-size:.9rem}
.review-section+.review-section{margin-top:1.5rem}
dialog{width:min(31rem,calc(100% - 2rem));color:var(--ink);border:1px solid var(--line);border-radius:.9rem;padding:1.25rem}
dialog::backdrop{background:#102b3b80}
</style>
</head>
<body>
<header><div class="header">
  <span class="brand">QCM médecine</span>
  <button id="open-import" type="button">Importer une série</button>
</div></header>
<main>
  <h1 id="title"></h1>
  <p id="source" class="muted"></p>
  <div id="quiz"></div>
  <details id="import">
    <summary>Créer une série à partir d’un nouveau PDF</summary>
    <p>Joins ton PDF à une conversation ChatGPT, indique le chapitre et colle la consigne ci-dessous. Importe ensuite le fichier JSON obtenu ou colle son contenu ici.</p>
    <button id="copy" type="button">Copier la consigne</button>
    <textarea id="prompt" readonly aria-label="Consigne pour ChatGPT" hidden></textarea>
    <p id="copy-status" class="status" role="status"></p>
    <label for="bank-file">Fichier de questions (.json)</label>
    <input id="bank-file" type="file" accept=".json,application/json">
    <label for="bank-text">Ou coller le JSON</label>
    <textarea id="bank-text" placeholder="Colle ici le contenu généré par ChatGPT."></textarea>
    <button id="load-text" type="button">Charger le JSON collé</button>
    <p id="import-status" class="status" role="status"></p>
  </details>
</main>
<dialog id="confirm">
  <h2>Terminer la série</h2>
  <p id="confirm-text"></p>
  <form method="dialog" class="actions">
    <button value="cancel" autofocus>Revenir au quiz</button>
    <button value="grade" class="primary">Voir le corrigé</button>
  </form>
</dialog>
<script type="application/json" id="initial-bank">{
  "version": 1,
  "titre": "Vision et audition",
  "source": "Ronéo 2 · Biophysique sensorielle, vision et audition (suite)",
  "questions": [
    {
      "enonce": "À propos de l’hypermétropie, en l’absence d’accommodation, quelles propositions sont exactes ?",
      "propositions": [

        {"texte":"Les rayons issus d’un objet à l’infini convergeraient en avant de la rétine.","vrai":false,"explication":"Le foyer image se trouve en arrière de la rétine en l’absence d’accommodation.","page":6},
        {"texte":"Le punctum remotum est virtuel.","vrai":true,"explication":"Le cours le situe théoriquement en arrière de l’œil.","page":6},

        {"texte":"Les membranes de Reissner et basilaire délimitent seulement deux étages.","vrai":false,"explication":"Les deux membranes délimitent trois étages.","page":10},
        {"texte":"L’organe de Corti repose sur la membrane tectoriale.","vrai":false,"explication":"L’organe de Corti repose sur la membrane basilaire.","page":11},
        {"texte":"Le nerf auditif transmet les variations de pression sous forme de vibrations mécaniques.","vrai":false,"explication":"L’information est véhiculée dans le nerf auditif sous forme de potentiels d’action.","page":10}

</script>
<script>
"use strict";
const prompt = "Analyse le PDF de cours que je joins. Demande-moi le chapitre si je ne l’indique pas. Prépare 5 QCM inédits pour une étudiante en 3ᵉ année de médecine à Toulouse. Calque le niveau, les formulations et les types de distracteurs sur les QCM types du chapitre ou sur les exemples que je joins. Utilise le cours pour établir les réponses. Reprends les conventions des exemples et évite les passages ambigus ou contradictoires.\n\nChaque QCM doit afficher cinq propositions A à E, avec une ou plusieurs réponses exactes. Varie le nombre de bonnes réponses et la difficulté. Formule des propositions indépendantes : aucune référence à la lettre ou à la position d’une autre proposition. Le quiz mélange les propositions automatiquement. Une proposition de synthèse en E est facultative et ponctuelle. Utilise « toutes_fausses » quand les quatre propositions sont fausses, ou « toutes_vraies » quand elles sont toutes vraies. Dans ce second cas, A, B, C, D et E sont toutes considérées comme exactes.\n\nPour chaque proposition, donne une justification pédagogique et le numéro de la page du PDF (première page = 1), y compris pour les propositions vraies. Vérifie chaque réponse et chaque renvoi avant de livrer. Si un passage ou un schéma est illisible, utilise uniquement les éléments lisibles et demande l’image si elle est indispensable.\n\nLivre un fichier téléchargeable .json en UTF-8. À défaut, donne le JSON complet dans un seul bloc à copier. Le format est un objet avec « version » (nombre 1), « titre » (texte), « source » (texte), « questions » (liste de 5 objets). Chaque question a « enonce » (texte) et « propositions » (liste de 5 objets). Chaque proposition a « texte » (texte), « vrai » (booléen true ou false), « explication » (texte) et « page » (entier positif). Pour une question avec une synthèse en E, ajoute à la question le champ « synthese » avec la valeur « toutes_fausses » ou « toutes_vraies » et fournis exactement 4 objets dans « propositions ». Le quiz construit la proposition E.\n";
const get = id => document.getElementById(id);
const letters = "ABCDE";
const summaries = {
  toutes_fausses: "Toutes les propositions A à D sont fausses.",
  toutes_vraies: "Toutes les propositions A à D sont vraies."
};
const validText = value => typeof value === "string" && value.trim().length > 0;

function validate(bank) {
  if (bank?.version !== 1 || !validText(bank.titre) || !validText(bank.source) ||
      !Array.isArray(bank.questions) || !bank.questions.length) {
    throw new Error("Le JSON doit contenir la version 1, un titre, une source et des questions.");
  }
  bank.questions.forEach((q, index) => {
    const label = "Question " + (index + 1) + " — ";
    if (!q || !validText(q.enonce) || !Array.isArray(q.propositions)) {
      throw new Error(label + "énoncé ou propositions manquants.");
    }
    const summary = q.synthese !== undefined;
    if (summary && !Object.hasOwn(summaries, q.synthese)) {
      throw new Error(label + "type de synthèse en E inconnu.");
    }
    if (q.propositions.length !== (summary ? 4 : 5)) {
      throw new Error(label + (summary ? "quatre propositions sont requises avec la synthèse en E." : "cinq propositions sont requises."));
    }
    if (q.propositions.some(p => !p || !validText(p.texte) || typeof p.vrai !== "boolean" ||
        !validText(p.explication) || !Number.isInteger(p.page) || p.page < 1)) {
      throw new Error(label + "chaque proposition exige un texte, un booléen vrai, une explication et une page positive.");
    }
    if (summary && !q.propositions.every(p => p.vrai === (q.synthese === "toutes_vraies"))) {
      throw new Error(label + "les réponses contredisent la proposition de synthèse en E.");
    }
    if (!summary && !q.propositions.some(p => p.vrai)) {
      throw new Error(label + "il faut au moins une proposition exacte.");
    }
  });
  return bank;
}

function shuffled(items) {
  const order = [...items];
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}

let bank, attempt, choices, current;
function start(nextBank) {
  bank = nextBank;
  attempt = shuffled(bank.questions).map(q => {
    const options = shuffled(q.propositions);
    if (q.synthese) {
      options.push({
        texte: summaries[q.synthese],
        vrai: true,
        explication: q.synthese === "toutes_vraies"
          ? "Les quatre propositions sont vraies. Les cinq cases doivent être cochées."
          : "Les quatre propositions sont fausses. Seule la case E doit être cochée."
      });
    }
    return {...q, options};
  });
  choices = attempt.map(() => new Set());
  current = 0;
  get("title").textContent = bank.titre;
  get("source").textContent = bank.source;
  renderQuestion();
}

function el(tag, value, className) {
  const element = document.createElement(tag);
  if (value !== undefined) element.textContent = value;
  if (className) element.className = className;
  return element;
}
function button(text, action, className) {
  const b = el("button", text, className);
  b.type = "button";
  b.addEventListener("click", action);
  return b;
}
function move(index) {
  current = index;
  renderQuestion();
  get("question").focus();
}
function renderQuestion() {
  const quiz = get("quiz");
  const q = attempt[current];
  const row = el("div", undefined, "progress-row");
  const count = el("span");
  count.setAttribute("aria-live", "polite");
  row.append(el("span", "Question " + (current + 1) + " sur " + attempt.length), count);
  const progress = el("progress");
  progress.max = attempt.length;
  progress.setAttribute("aria-label", "Questions avec une réponse");
  const nav = el("nav", undefined, "tabs");
  nav.setAttribute("aria-label", "Questions");
  const tabs = attempt.map((_, index) => {
    const b = button(String(index + 1), () => move(index));
    if (index === current) b.setAttribute("aria-current", "true");
    nav.append(b);
    return b;
  });
  function updateProgress() {
    const answered = choices.filter(set => set.size).length;
    count.textContent = answered + " sur " + attempt.length + " avec une réponse";
    progress.value = answered;
    tabs.forEach((tab, index) => {
      const done = choices[index].size > 0;
      tab.dataset.answered = done;
      tab.setAttribute("aria-label", "Question " + (index + 1) + (done ? ", avec une réponse" : ", sans réponse"));
    });
  }
  const card = el("section", undefined, "card");
  const heading = el("h2", q.enonce);
  heading.id = "question";
  heading.tabIndex = -1;
  card.setAttribute("aria-labelledby", heading.id);
  card.append(heading, el("p", "Coche toutes les propositions exactes.", "muted"));
  q.options.forEach((p, index) => {
    const label = el("label", undefined, "option");
    const input = el("input");
    input.type = "checkbox";
    input.checked = choices[current].has(index);
    input.addEventListener("change", () => {
      if (input.checked) choices[current].add(index);
      else choices[current].delete(index);
      updateProgress();
    });
    label.append(input, el("span", letters[index] + ".", "letter"), el("span", p.texte));
    card.append(label);
  });
  const actions = el("div", undefined, "actions");
  const previous = button("Précédente", () => move(current - 1));
  previous.disabled = current === 0;
  actions.append(previous);
  if (current < attempt.length - 1) actions.append(button("Suivante", () => move(current + 1), "primary"));
  actions.append(button("Terminer la série", confirmGrade, current === attempt.length - 1 ? "primary" : ""));
  card.append(actions);
  quiz.replaceChildren(row, progress, nav, card);
  updateProgress();
}
function confirmGrade() {
  const missing = choices.filter(set => !set.size).length;
  get("confirm-text").textContent = missing
    ? missing + (missing === 1 ? " question est sans réponse." : " questions sont sans réponse.") + " Tu peux encore les compléter."
    : "Toutes les questions ont une réponse. Tu peux afficher le score et les explications.";
  const dialog = get("confirm");
  dialog.returnValue = "cancel";
  dialog.showModal();
}
function renderResults() {
  const exact = attempt.map((q, i) => q.options.every((p, j) => p.vrai === choices[i].has(j)));
  const score = exact.filter(Boolean).length;
  const card = el("div", undefined, "card");
  const title = el("h2", "Score · " + score + " / " + attempt.length);
  title.tabIndex = -1;
  card.append(title, el("p", "Un point par question si toutes les cases attendues sont cochées et qu’aucune proposition fausse n’est cochée.", "muted"));
  attempt.forEach((q, i) => {
    const section = el("section", undefined, "review-section");
    section.append(el("h3", (i + 1) + ". " + q.enonce));
    const expected = q.options.map((p, j) => p.vrai ? letters[j] : "").filter(Boolean).join(", ");
    const selected = [...choices[i]].sort().map(j => letters[j]).join(", ") || "aucune";
    section.append(el("p", "Attendu · " + expected + " | Ton choix · " + selected, "muted"));
    q.options.forEach((p, j) => {
      const checked = choices[i].has(j);
      const status = p.vrai ? (checked ? "Vrai · coché" : "Vrai · oublié") : (checked ? "Faux · coché" : "Faux · écarté");
      const review = el("div", undefined, "review " + (p.vrai === checked ? "correct" : "error"));
      review.append(el("strong", letters[j] + ". " + p.texte), el("p", status + " — " + p.explication));
      if (p.page) review.append(el("p", "Page " + p.page + " du PDF", "ref"));
      section.append(review);
    });
    card.append(section);
  });
  card.append(button("Refaire la série", () => moveAfterStart(bank), "primary"));
  get("quiz").replaceChildren(card);
  title.focus();
  window.scrollTo(0, 0);
}
function moveAfterStart(nextBank) {
  start(nextBank);
  get("question").focus();
  window.scrollTo(0, 0);
}
function importText(text) {
  let nextBank;
  try {
    const clean = text.trim().replace(/^```(?:json)?\s*([\s\S]*?)\s*```$/i, "$1");
    nextBank = validate(JSON.parse(clean));
  } catch (error) {
    get("import-status").textContent = error instanceof SyntaxError ? "JSON illisible. Colle le bloc JSON complet généré par ChatGPT." : error.message;
    return;
  }
  get("import-status").textContent = "";
  get("bank-text").value = "";
  get("import").open = false;
  moveAfterStart(nextBank);
}

get("confirm").addEventListener("close", () => {
  if (get("confirm").returnValue === "grade") renderResults();
});
get("open-import").addEventListener("click", () => {
  get("import").open = true;
  get("import").scrollIntoView({block:"start"});
  get("copy").focus({preventScroll:true});
});
get("prompt").value = prompt;
get("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(prompt);
    get("copy-status").textContent = "Consigne copiée.";
  } catch {
    get("prompt").hidden = false;
    get("prompt").focus();
    get("prompt").select();
    get("copy-status").textContent = "Copie le texte sélectionné.";
  }
});
get("load-text").addEventListener("click", () => importText(get("bank-text").value));
get("bank-file").addEventListener("change", async event => {
  const file = event.target.files[0];
  event.target.value = "";
  if (!file) return;
  try {
    importText(await file.text());
  } catch {
    get("import-status").textContent = "Impossible de lire ce fichier. Essaie de coller le JSON.";
  }
});
start(validate(JSON.parse(get("initial-bank").textContent)));
</script>
</body>
</html>
